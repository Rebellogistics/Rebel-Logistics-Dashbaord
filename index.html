    <!--
      THESIS: A specialist handler of irreplaceable things, priced like a
      partner and not a mover. Refuses the removalist category's stock-photo
      truck-and-badge layout, and refuses the luxury cliche of cream paper and
      a fashion serif.
      OWN-WORLD: Architectural quiet luxury. Warm-white ground, near-black ink,
      one restrained oxblood accent used only as hairlines, numerals and small
      marks. Hanken Grotesk alone. 2px radii, hairline rules, large fields of
      air. Gold appears only inside the wordmark.
      STORY: This company moves Fendi, Versace and Bentley pieces into
      Melbourne's best homes; it plans access before it quotes; asking costs a
      minute.
      FIRST VIEWPORT: Full-bleed scroll-scrubbed film of a gloved handler
      wrapping a designer chair. Headline lower-left over a scrim, phrase
      changing with scroll progress; white primary action beside a ghost link.
      FORM: Editorial architectural monograph, chosen over the category's
      brochure grid.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
